# Conda environment for ORD Flight Intelligence.
# Source of truth for dependencies; conda-lock.yml pins exact builds (regenerate with `make lock`).
# conda-forge only: avoids Anaconda's `defaults` channel and its terms-of-service requirements.
#
# Decisions: storage/transformation in docs/adr/0002, orchestration in docs/adr/0003.
# Deferred until the matching phase (see docs/research, §7 and §11):
#   serving (FastAPI, uvicorn), Streamlit dashboards  -> Phase 2
#   weather grids (xarray, cfgrib, herbie-data), MLflow  -> Phase 1b
name: ordfi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip

  # Data access, storage and transformation
  - python-duckdb>=1.2
  - pyarrow>=17
  - pandas>=2.2
  - polars>=1.0
  - dbt-core>=1.9,<2      # dbt Core v1 line (ADR-0002)
  - dbt-duckdb>=1.9,<2
  - httpx>=0.27
  - tenacity
  - pydantic>=2.7
  - python-dotenv
  - pyyaml

  # Orchestration (ADR-0003); dagster-dbt versions in lockstep with dagster
  - dagster>=1.13
  - dagster-webserver>=1.13
  - dagster-dbt

  # Modeling
  - scikit-learn>=1.5
  - lightgbm>=4.5
  - catboost=1.2.*=cpu*   # CPU build: the solver otherwise picks a CUDA variant on linux-64
  - shap>=0.46
  - mapie>=0.9

  # Data quality
  - pandera>=0.20

  # Notebooks and visualization
  - jupyterlab>=4
  - ipykernel
  - matplotlib
  - plotly

  # Development tooling
  - pytest>=8
  - pytest-cov
  - hypothesis>=6
  - ruff>=0.6
  - mypy>=1.11
  - pandas-stubs
  - types-pyyaml
  - pre-commit>=3.7
  - nbstripout
  - conda-lock>=2.5
