version: 2

models:
  - name: calendar
    description: >
      One row per date, 2000-01-01..2030-12-31: weekday fields, US federal holidays (actual and
      observed dates), days to the next and since the previous holiday, and America/Chicago DST.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: day_of_week
        description: ISO weekday, 1 = Monday .. 7 = Sunday.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: holiday
        description: Federal holiday whose actual date this is.
      - name: holiday_observed
        description: Federal holiday observed (day off) on this date; Saturday → Friday, Sunday → Monday.
      - name: days_to_holiday
        description: Days to the next actual holiday date (0 on the day).
      - name: days_since_holiday
        description: Days since the previous actual holiday date (0 on the day).
      - name: utc_offset_hours
        description: America/Chicago UTC offset at local noon (-6 standard, -5 daylight).
      - name: dst_change
        description: "'start' or 'end' on the day a DST transition happens (02:00 local)."

  - name: flight_leg
    description: >
      One row per scheduled ORD departure or arrival (BTS). From 2018 the source is the
      marketing-carrier file; for 2015–2017 it is the reporting-carrier file, which misses some
      carriers in those years (see the BTS data cards).
    columns:
      - name: flight_key
        description: flight_date, operating carrier, flight number, origin, dest, scheduled departure (local hhmm).
        data_tests: [unique, not_null]
      - name: direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [departure, arrival]
      - name: source_table
        data_tests:
          - accepted_values:
              arguments:
                values: [marketing, reporting]
      - name: sched_ord_utc
        description: >
          Scheduled time at ORD: departure for departures, arrival for arrivals. Null for the few
          arrivals without a scheduled elapsed time.
      - name: valid_time
        description: Scheduled departure (UTC).
        data_tests: [not_null]
      - name: known_time
        description: When the BTS month was first fetched, i.e. when these outcomes became available as labels.
        data_tests: [not_null]
      - name: tail_number
        description: Upper-cased; null when missing or a placeholder (fewer than 4 characters).

  - name: aircraft_rotation
    description: >
      One row per flown (not cancelled) leg of an aircraft on each local date on which that
      aircraft touches ORD, nationally, with the aircraft's previous leg. Legs are ordered by
      actual departure: tails are the aircraft that actually flew, so the links are known
      after the fact. Live features must use the currently assigned aircraft.
    columns:
      - name: flight_key
        description: Same key as flight_leg; ORD legs link to it.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('flight_leg')
                field: flight_key
              config:
                where: touches_ord
      - name: tail_number
        data_tests: [not_null]
      - name: leg_seq
        description: Order of the leg within the aircraft's local date (1 = first leg flown).
        data_tests: [not_null]
      - name: prev_flight_key
        description: >
          The aircraft's previous flown leg, on the same date or the date before (null if it
          did not fly then). For an ORD departure this is usually the inbound arrival.
      - name: station_continuous
        description: The previous leg ended where this one starts (about 98 %; breaks are legs outside BTS, such as positioning or international flights).
      - name: sched_ground_min
        description: Scheduled departure minus the previous leg's scheduled arrival; negative after aircraft swaps.
      - name: actual_ground_min
        description: Actual departure minus the previous leg's actual arrival.

  - name: weather_obs
    description: >
      One row per ORD METAR (routine and special), with ceiling, FAA flight category and
      present-weather flags. Use both report types together; IEM's labels are unreliable in 2001
      and Jan–Jul 2006.
    data_tests:
      - unique_combination:
          arguments:
            columns: [valid_time, report_type]
    columns:
      - name: valid_time
        data_tests: [not_null]
      - name: known_time
        description: Observation time + 10 min (IEM archive latency).
        data_tests: [not_null]
      - name: ceiling_ft
        description: Lowest broken, overcast or vertical-visibility layer; null if none reported.
      - name: flight_category
        data_tests:
          - accepted_values:
              arguments:
                values: [VFR, MVFR, IFR, LIFR]
      - name: has_thunder
        description: Thunderstorm reported, including in the vicinity (VCTS).

  - name: weather_obs_hourly
    description: >
      One row per UTC hour: the latest values reported in the hour and the worst conditions seen
      during it. Hours without observations are kept (n_obs = 0). A row is complete only at its
      known_time, so features as of time t must use rows with known_time <= t.
    columns:
      - name: valid_time
        description: Start of the hour (UTC).
        data_tests: [unique, not_null]
      - name: n_obs
        data_tests: [not_null]
      - name: known_time
        description: The hour's last observation time + 10 min; null for empty hours.

  - name: atc_program
    description: >
      One row per ORD-related ATCSCC program advisory (GDP, ground stop, AFP, CTOP), with its
      period parsed to UTC. Advisories for other airports that mention ORD, ZAU or C90 are
      included; filter on `airport`.
    data_tests:
      - unique_combination:
          arguments:
            columns: [adv_date, number]
    columns:
      - name: program_type
        data_tests:
          - accepted_values:
              arguments:
                values: [gdp, ground_stop, afp, ctop]
      - name: is_proposed
        description: Proposed programs (e.g. "CDM PROPOSED GROUND DELAY PROGRAM") are not in effect.
      - name: period_format
        description: >
          How `period_text` was read: 'dated' (DD/HHMMZ - DD/HHMMZ, the end's day optional),
          'open' (DD/HHMM -, no end), 'undated' (HHMMZ-HHMMZ), 'until' (UNTIL HHMMZ, from the send
          time) or 'update' (an old ground stop's expected update time, from the send time).
      - name: period_text
        description: >
          The advisory's period as written: the program or ground-stop period, or before
          November 2006 a GDP's ARRIVALS ESTIMATED FOR window (for a revision, from the revision).
          Some ground stops, mostly before 2007, have none (in effect until cancelled).
      - name: start_utc
        description: >
          Period start; days are resolved to the month nearest the send time. Null when the
          period is missing, unreadable or implausible (a mistyped day: it runs backwards, lasts
          over two days or starts over two days from the send time).
      - name: end_utc
        description: Period end; resolved after the start. Null when start_utc is, or for an open period.
      - name: known_time
        description: The advisory's send time.
        data_tests: [not_null]

  - name: atc_program_interval
    description: >
      One row per ORD ground delay program or ground stop (2001 →), from its start to its
      cancellation or end, chained from atc_program's advisories. GDP periods are arrival times at
      ORD; ground-stop periods are departure times at the origins they cover. Final at
      known_time; for a program as known earlier, use atc_program_interval_version.
    columns:
      - name: program_id
        description: "Airport, type and first advisory: e.g. ORD-gdp-20190714-112."
        data_tests: [unique, not_null]
      - name: program_type
        data_tests:
          - accepted_values:
              arguments:
                values: [gdp, ground_stop]
      - name: scope
        description: >
          'general', or a ground stop limited to one carrier ('carrier', e.g. "EGF ONLY") or to
          aircraft not cleared for low-visibility approaches ('equipment', "CAT I"). Each scope is
          chained separately, so a carrier stop can run during a general one.
        data_tests:
          - accepted_values:
              arguments:
                values: [general, carrier, equipment]
      - name: start_utc
        description: >
          The earliest period start of its advisories (else the first send time). A stop
          re-issued just after a cancellation starts at the cancellation.
        data_tests: [not_null]
      - name: end_utc
        description: >
          When a cancellation took effect, else the last advisory's end (revisions extend and
          shorten programs). Null when no advisory states a time (end_reason 'unknown').
      - name: end_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [cancelled, expired, unknown]
      - name: planned_end_utc
        description: The first end stated, before any revision.
      - name: first_issued_at
        description: Send time of the first advisory, when the program became known.
        data_tests: [not_null]
      - name: min_program_rate
        description: The lowest hourly arrival rate in the GDP's advisories.
      - name: known_time
        description: When the row is final, at the program's end or its last advisory if later.
        data_tests: [not_null]

  - name: atc_program_interval_version
    description: >
      Each ORD program as known after each of its advisories. As of time t, a program is its
      version with known_time <= t < valid_to (valid_to null: the latest version); it is in effect
      at t if start_utc <= t < end_utc. The last version matches atc_program_interval.
    data_tests:
      - unique_combination:
          arguments:
            columns: [program_id, version]
    columns:
      - name: program_id
        data_tests:
          - relationships:
              arguments:
                to: ref('atc_program_interval')
                field: program_id
      - name: change
        data_tests:
          - accepted_values:
              arguments:
                values: [issued, revised, updated, partly cancelled, cancelled]
      - name: start_utc
        data_tests: [not_null]
      - name: end_utc
        description: The end as then stated; at a cancellation, when it took effect.
      - name: known_time
        description: The advisory's send time.
        data_tests: [not_null]
      - name: valid_to
        description: When the next version replaced this one (null for the latest).

  - name: taf_hourly
    description: >
      One row per ORD TAF and hour of its validity window (2000 →), from our own parse of the raw
      bulletins (ordfi.ingest.taf). Each row has the prevailing forecast at the start of the hour
      and the TEMPO and PROB overlays touching it. For the forecast as of time t, keep rows with
      known_time <= t and the latest issuance per valid hour.
    data_tests:
      - unique_combination:
          arguments:
            columns: [product_id, valid_time]
    columns:
      - name: valid_time
        description: Start of the forecast hour (UTC).
        data_tests: [not_null]
      - name: known_time
        description: When the TAF was sent (WMO header) + 10 min.
        data_tests: [not_null]
      - name: lead_hours
        description: Hours from sending to the forecast hour.
      - name: prevailing_kind
        description: "The group the prevailing forecast comes from: initial, FM or BECMG."
      - name: flight_category
        description: FAA category of the prevailing forecast.
        data_tests:
          - accepted_values:
              arguments:
                values: [VFR, MVFR, IFR, LIFR]
      - name: worst_flight_category
        description: The worst category the TAF allows for the hour, TEMPO and PROB groups included.
      - name: prob_pct
        description: Highest PROB group (30 or 40) touching the hour.
  - name: gfs_mos
    description: >
      GFS MOS (MAV) station guidance for ORD from IEM's archive (2014-12 →): one row per run
      (00, 06, 12, 18Z) and 3-hourly projection, 6 to 72 h ahead, with the MAV card's ceiling
      and visibility categories and the flight category they imply. For the guidance as of time
      t, keep rows with known_time <= t and the latest run per valid time.
    data_tests:
      - unique_combination:
          arguments:
            columns: [runtime, valid_time]
    columns:
      - name: known_time
        description: The run time + 5 h (data-catalog card iem_mos).
        data_tests: [not_null]
      - name: valid_time
        data_tests: [not_null]
      - name: ceiling_category
        description: "MAV ceiling category: 1 < 200 ft, 2 200-400, 3 500-900, 4 1000-1900, 5 2000-3000, 6 3100-6500, 7 6600-12000, 8 higher or unlimited."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8]
      - name: visibility_category
        description: "MAV visibility category: 1 < 1/2 mi, 2 1/2 to < 1, 3 1 to < 2, 4 2 to < 3, 5 3-5, 6 6, 7 more than 6."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: flight_category
        description: The worse of the categories the ceiling and visibility imply.
        data_tests:
          - accepted_values:
              arguments:
                values: [VFR, MVFR, IFR, LIFR]
      - name: thunder_6h_pct
        description: Probability of a thunderstorm in the 6 hours ending at valid_time.
  - name: nbm
    description: >
      NBM short-range (NBS) station guidance for ORD from IEM's archive (2018-11 →): one row per
      cycle (IEM keeps 01, 07, 13, 19Z) and 3-hourly projection to 72 h ahead. For the guidance
      as of time t, keep rows with known_time <= t and the latest cycle per valid time.
    data_tests:
      - unique_combination:
          arguments:
            columns: [runtime, valid_time]
    columns:
      - name: known_time
        description: The cycle time + 70 min (data-catalog card noaa_nbm).
        data_tests: [not_null]
      - name: valid_time
        data_tests: [not_null]
      - name: ceiling_ft
        description: Ceiling height in feet; null when unlimited (888 before NBM v4.0, -88 after).
      - name: visibility_mi
        description: >
          Visibility in miles, capped at 10 (10 or more). The bulletin gives whole miles before
          the 2020-02-20 12Z cycle and tenths after; null when it gives none (999).
      - name: flight_category
        data_tests:
          - accepted_values:
              arguments:
                values: [VFR, MVFR, IFR, LIFR]
      - name: ifr_ceiling_pct
        description: Probability of an IFR ceiling (below 1,000 ft); from NBM v4.0 (2020-09-29).
      - name: ifr_visibility_pct
        description: Probability of IFR visibility (below 3 miles); from NBM v4.0 (2020-09-29).
      - name: thunder_3h_pct
        description: Probability of thunder in the 3 hours ending at valid_time.
